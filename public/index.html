<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼성전자 · SK하이닉스 주가 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>삼성전자 · SK하이닉스 주가 대시보드</h1>
      <p class="notice">
        본 화면은 <strong>금융위원회_주식시세정보(공공데이터포털)</strong> API를 사용합니다.
        해당 데이터는 <strong>실시간이 아닌 일별 시세</strong>이며, 기준일 다음 영업일 오후에 갱신됩니다.
      </p>
    </header>

    <div class="toolbar">
      <span id="updatedAt" class="updated-at">불러오는 중...</span>
      <button id="refreshBtn" class="refresh-btn">새로고침</button>
    </div>

    <div id="errorBox" class="error-box" hidden></div>

    <main id="cards" class="cards">
      <!-- 카드는 app.js가 동적으로 생성 -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
